<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account | Shaik Irfan</title><link rel="stylesheet" href="css/auth.css">
  <script src="js/auth.js" defer></script>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <p class="eyebrow">GET STARTED</p>
      <h1>Create your account</h1>
      <p class="subtext">Register to access the portfolio.</p>
      <form id="signupForm">
        <label for="name">Full name</label><input id="name" name="name" type="text" autocomplete="name" minlength="2" maxlength="60" placeholder="Your name" required>
        <label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
        <label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Re-enter your password" required>
        <button class="submit-button" type="submit">Create account</button>
        <p class="form-message" id="formMessage" role="status"></p>
      </form>
      <p class="switch-auth">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>
</body>
</html>
