<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Shaik Irfan</title><link rel="stylesheet" href="css/auth.css">
  <script src="js/auth.js" defer></script>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <p class="eyebrow">WELCOME BACK</p>
      <h1>Log in to your account</h1>
      <p class="subtext">Enter your details to continue.</p>
      <form id="loginForm">
        <label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
        <button class="submit-button" type="submit">Log in</button>
        <p class="form-message" id="formMessage" role="status"></p>
      </form>
      <p class="switch-auth">Don't have an account? <a href="signup.html">Create account</a></p>
    </section>
  </main>
</body>
</html>
